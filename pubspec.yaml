name: confaero_app
description: "Confaero — A comprehensive conference management app for attendees, organizers, sponsors, and volunteers."
publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router:
  flutter_svg: ^2.0.16
  lottie:
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  flutter_staggered_animations: ^1.1.1
  shared_preferences: ^2.5.3
  get: ^4.6.6
  mime_type: ^1.0.1
  flutter_spinkit: ^5.2.1
  toastification:
  quickalert: ^1.1.0
  country_pickers: ^3.0.1
  video_player: ^2.10.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  file_picker: ^10.1.2
  device_preview:
  internet_connection_checker_plus: ^2.5.2
  emoji_picker_flutter: ^2.0.0
  syncfusion_flutter_charts:
  dio:
  logger:
  intl: ^0.19.0
  socket_io_client:
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0-beta.2
  connectivity_plus: ^6.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  country_picker: ^2.0.26
  table_calendar: ^3.1.2
  zego_uikit_prebuilt_video_conference: 2.10.3
  zego_uikit: 2.28.28
  permission_handler: ^12.0.1
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2

dependency_overrides:
  # zego_express_engine 3.23.0+ added 2 new args to ZegoPublishStreamQuality (17 total)
  # zego_uikit 2.28.28 passes only 15 args — pin to 3.22.0 which has 15 args
  zego_express_engine: 3.22.0
  # zego_plugin_adapter 2.14.x renamed/removed licence param — pin to compatible version
  zego_plugin_adapter: 2.13.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner:
  flutter_gen_runner:
  flutter_launcher_icons:

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  adaptive_icon_background: "#0FC3C2"

#flutter_icons:
#  android: true
#  ios: true
#  image_path: "assets/images/App_Icon.png"
#  adaptive_icon_foreground: "assets/images/App_Icon.png"
#  adaptive_icon_background: "#AD9D8D"

flutter_gen:
  output: lib/global/custom_assets/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)
  # Optional
  integrations:
    flutter_svg: true
    # flare_flutter: true
    # rive: true
    lottie: true
    #===========>>>>>>>>>> Flutter Gen Code ==============>>>>>>>>>>>
    # dart pub global activate flutter_gen
    # flutter pub run build_runner build --delete-conflicting-outputs
#    fvm dart run build_runner build

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  # example:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Medium.ttf
        - asset: assets/fonts/Inter_28pt-Regular.ttf
